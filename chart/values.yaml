# Keep one replica: the tables being played live in the memory of the pod, and
# two pods would not see each other's tables. Rooms are saved to the database
# and come back after a restart, in their lobby: a game being played is lost.
replicaCount: 1

fullnameOverride: ""
nameOverride: ""

image:
  repository: ghcr.io/bingops-com/games
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

# The server sits behind the ingress controller, which writes
# X-Forwarded-For and X-Forwarded-Proto: the session cookie is then marked
# Secure and HSTS is sent. Set to false only if pods are reached directly.
trustProxy: true

# The address players reach the site at, written in the links sent by mail,
# e.g. https://games.lab.bingo. Empty takes it from the request.
publicUrl: ""

# Links to choose a new password are sent through an SMTP relay that signs
# them (DKIM); in the lab that is relay.mail.svc:587 (labops,
# apps/platform/mail). Without a relay the links are only written to the log.
mail:
  relay: ""
  from: noreply@games.lab.bingo
  # Where bounces go, and the name SPF is checked against.
  envelope: bounces@smtp.games.lab.bingo

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: traefik
  # Required when enabled, e.g. games.lab.bingo
  host: ""
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-cloudflare
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
  tls:
    enabled: true
    # Defaults to <fullname>-tls.
    secretName: ""

database:
  # A CloudNativePG cluster owned by this release. The server reads its
  # connection string from the secret CloudNativePG generates (<cluster>-app,
  # key "uri"), so no password is written in values or in Git.
  cnpg:
    enabled: true
    instances: 1
    database: games
    owner: games
    storage:
      size: 2Gi
      # Empty uses the cluster's default storage class.
      storageClass: ""
    # Continuous archiving and a daily base backup to S3-compatible storage,
    # through the Barman Cloud plugin.
    backup:
      enabled: false
      destinationPath: ""   # e.g. s3://bucket/games
      endpointURL: ""
      # Existing secret with ACCESS_KEY_ID and ACCESS_SECRET_KEY.
      credentialsSecret: ""
      # Folder of this incarnation of the database in the archive. Barman
      # refuses to archive into a folder written by an earlier incarnation:
      # bump the suffix whenever the cluster is recreated with initdb.
      serverName: games-postgresql-g1
      schedule: "0 30 3 * * *"
      retentionPolicy: 14d
    podMonitor:
      enabled: false
  # With cnpg.enabled=false: an existing secret holding the connection string
  # (postgres://user:password@host:5432/games).
  existingSecret:
    name: ""
    key: uri

resources:
  requests:
    cpu: 20m
    memory: 64Mi
  limits:
    # A password check takes 19 MiB (Argon2id), four at once at most.
    memory: 384Mi

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
