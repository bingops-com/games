# Keep one replica: the tables being played live in the memory of the pod, and
# two pods would not see each other's tables. Rooms are saved to the database
# and come back after a restart, in their lobby: a game being played is lost.
replicaCount: 1

# Also enabled automatically whenever ingress.enabled=true. Never open the
# service publicly with this disabled, including through a tunnel.
production: false

fullnameOverride: ""
nameOverride: ""

image:
  repository: ghcr.io/bingops-com/games
  # Defaults to the chart's appVersion.
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

# The server sits behind the ingress controller, which writes
# X-Forwarded-For and X-Forwarded-Proto: the session cookie is then marked
# Secure and HSTS is sent. Set to false only if pods are reached directly.
trustProxy: true

# Canonical public HTTPS origin, required in production.
publicUrl: ""

# Separate Authentik OIDC session; player accounts never acquire this role.
admin:
  enabled: false
  issuer: ""
  clientId: games-admin
  username: bingops
  group: games-admins

# The CNI must enforce NetworkPolicy. Only these proxies may reach the server.
# Add the Cloudflare connector's namespace AND pod labels if a tunnel connects
# directly to the service. Egress is DNS and PostgreSQL, plus declared HTTPS
# peers only when the Authentik administrator panel is enabled.
networkPolicy:
  enabled: true
  ingressFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: traefik
      podSelector:
        matchLabels:
          app.kubernetes.io/name: traefik
  dnsTo:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
  # Empty selects the CNPG cluster owned by this release. Required with an
  # external database; use explicit pod/namespace selectors or a narrow CIDR.
  databaseTo: []
  # Required when admin.enabled=true: HTTPS peers for the Authentik issuer.
  adminTo: []

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: traefik
  # Required when enabled, e.g. games.lab.bingo
  host: ""
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-cloudflare
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
  tls:
    enabled: true
    # Defaults to <fullname>-tls.
    secretName: ""

database:
  # A CloudNativePG cluster owned by this release. The server reads its
  # connection string from the secret CloudNativePG generates (<cluster>-app,
  # key "uri"), so no password is written in values or in Git.
  cnpg:
    enabled: true
    instances: 1
    database: games
    owner: games
    # Bootstrap a NEW cluster from existing Barman archives. Never switch the
    # bootstrap of an already-created cluster. Empty objectStore uses the
    # ObjectStore created by this release with the configured backup location.
    recovery:
      enabled: false
      objectStore: ""
      serverName: ""
      targetTime: ""
    storage:
      size: 2Gi
      # Empty uses the cluster's default storage class.
      storageClass: ""
    # Continuous archiving and a daily base backup to S3-compatible storage,
    # through the Barman Cloud plugin.
    backup:
      enabled: false
      destinationPath: ""   # e.g. s3://bucket/games
      endpointURL: ""
      # Existing secret with ACCESS_KEY_ID and ACCESS_SECRET_KEY.
      credentialsSecret: ""
      # Folder of this incarnation of the database in the archive. Barman
      # refuses to archive into a folder written by an earlier incarnation:
      # bump the suffix whenever the cluster is recreated with initdb.
      serverName: games-postgresql-g1
      schedule: "0 30 3 * * *"
      retentionPolicy: 14d
    podMonitor:
      enabled: false
  # With cnpg.enabled=false: an existing secret holding the connection string
  # (postgres://user:password@host:5432/games).
  existingSecret:
    name: ""
    key: uri
    # Owning recovery runbook, required in production for an external database.
    backupRunbook: ""

resources:
  requests:
    cpu: 20m
    memory: 64Mi
  limits:
    # A password check takes 19 MiB (Argon2id), four at once at most.
    memory: 384Mi
    cpu: "1"

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
