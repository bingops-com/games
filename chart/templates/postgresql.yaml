{{- with .Values.database.cnpg }}
{{- if .enabled }}
{{- $name := include "games.postgresql" $ }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ $name }}
  labels:
    {{- include "games.labels" $ | nindent 4 }}
  annotations:
    # Uninstalling the release must not take the accounts with it.
    helm.sh/resource-policy: keep
spec:
  instances: {{ .instances }}
  bootstrap:
    initdb:
      database: {{ .database }}
      owner: {{ .owner }}
      dataChecksums: true
  storage:
    size: {{ .storage.size }}
    {{- with .storage.storageClass }}
    storageClass: {{ . }}
    {{- end }}
  {{- if .backup.enabled }}
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: {{ $name }}
        serverName: {{ .backup.serverName }}
  {{- end }}
{{- if .backup.enabled }}
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: {{ $name }}
  labels:
    {{- include "games.labels" $ | nindent 4 }}
spec:
  configuration:
    destinationPath: {{ required "database.cnpg.backup.destinationPath is required when backup is enabled" .backup.destinationPath }}
    {{- with .backup.endpointURL }}
    endpointURL: {{ . }}
    {{- end }}
    s3Credentials:
      accessKeyId:
        name: {{ required "database.cnpg.backup.credentialsSecret is required when backup is enabled" .backup.credentialsSecret }}
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: {{ .backup.credentialsSecret }}
        key: ACCESS_SECRET_KEY
    wal:
      compression: gzip
    data:
      compression: gzip
  retentionPolicy: {{ .backup.retentionPolicy }}
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: {{ $name }}-daily
  labels:
    {{- include "games.labels" $ | nindent 4 }}
spec:
  schedule: {{ .backup.schedule | quote }}
  backupOwnerReference: self
  cluster:
    name: {{ $name }}
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
{{- end }}
{{- if .podMonitor.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ $name }}
  labels:
    {{- include "games.labels" $ | nindent 4 }}
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: {{ $name }}
  podMetricsEndpoints:
    - port: metrics
{{- end }}
{{- end }}
{{- end }}
