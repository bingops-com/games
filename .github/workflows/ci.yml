name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: games
          POSTGRES_PASSWORD: games
          POSTGRES_DB: games
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U games"
          --health-interval 2s
          --health-retries 30
    env:
      GAMES_TEST_DATABASE_URL: postgres://games:games@localhost:5432/games
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the web UI
        run: make web

      - name: Audit locked web dependencies
        working-directory: web
        run: npm audit --package-lock-only --audit-level=high

      - name: Vet and typecheck
        run: |
          go vet ./...
          cd web && npm run typecheck

      - name: Test
        run: go test -race ./...

      - name: Check reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      - name: Lint the Helm chart
        run: bash chart/tests/check.sh

      - name: Build the server
        run: CGO_ENABLED=0 go build -trimpath -o /tmp/games ./cmd/games

  image:
    name: Scan and publish immutable image
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/bingops-com/games:sha-${{ github.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build production image
        run: docker build --pull --tag "$IMAGE" .

      - name: Refuse high and critical image vulnerabilities
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock:ro aquasec/trivy:0.66.0 image --image-src docker --scanners vuln --severity HIGH,CRITICAL --exit-code 1 "$IMAGE"

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Publish commit image
        run: docker push "$IMAGE"
